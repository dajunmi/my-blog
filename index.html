<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人机验证 - my-blog123</title>
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .verify-container {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .verify-icon { font-size: 48px; margin-bottom: 16px; }
        .verify-title { font-size: 22px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .verify-desc { font-size: 14px; color: #888; margin-bottom: 32px; line-height: 1.6; }
        #turnstile-widget { display: flex; justify-content: center; margin-bottom: 24px; min-height: 65px; }
        .verify-status { font-size: 13px; color: #999; margin-top: 16px; }
        .verify-status.success { color: #28a745; }
        .content-hidden { display: none; }
        #blog-content { padding: 20px; max-width: 800px; margin: 0 auto; }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <!-- ====== 人机验证页面 ====== -->
    <div id="verify-page" class="verify-container">
        <div class="verify-icon">🔒</div>
        <h1 class="verify-title">人机验证</h1>
        <p class="verify-desc">请完成下方验证以访问网站内容</p>
        <div 
            class="cf-turnstile" 
            id="turnstile-widget"
            data-sitekey="0x4AAAAAAGCHvglNZyDeGAQP"
            data-theme="light"
            data-language="zh-CN"
            data-callback="onTurnstileSuccess"
            data-error-callback="onTurnstileError"
            data-expired-callback="onTurnstileExpired"
        ></div>
        <p class="verify-status" id="verify-status">等待验证...</p>
    </div>

    <!-- ====== 验证通过后显示的博客内容 ====== -->
    <div id="blog-content" class="content-hidden">
        <!-- 在这里放入你原来的博客内容 -->
        <h1>欢迎来到 my-blog123</h1>
        <p>验证通过！这里是你的网站内容。</p>
    </div>

    <script>
        function onTurnstileSuccess(token) {
            document.getElementById('verify-status').textContent = '✅ 验证通过，正在进入...';
            document.getElementById('verify-status').classList.add('success');
            setTimeout(function() {
                document.getElementById('verify-page').style.display = 'none';
                document.getElementById('blog-content').classList.remove('content-hidden');
            }, 800);
        }
        function onTurnstileError() {
            document.getElementById('verify-status').textContent = '❌ 验证失败，请重试';
        }
        function onTurnstileExpired() {
            document.getElementById('verify-status').textContent = '⏰ 验证已过期，请重新验证';
        }
    </script>
</body>
</html>
