<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10182d">
<title>2025届七年级二班大事年表</title>
<style>
:root{--ink:#f5f7ff;--muted:#b8c2dc;--line:rgba(255,255,255,.16);--glass:rgba(255,255,255,.105)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;background:#10182d;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-2;border-radius:50%;filter:blur(2px);pointer-events:none}
body:before{width:560px;height:560px;left:-170px;top:-170px;background:radial-gradient(circle,rgba(80,145,255,.65),transparent 68%);animation:floatA 15s ease-in-out infinite alternate}
body:after{width:650px;height:650px;right:-190px;bottom:-260px;background:radial-gradient(circle,rgba(168,105,255,.48),transparent 68%);animation:floatB 18s ease-in-out infinite alternate}
.bg-glow{position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse at 50% 15%,rgba(36,75,130,.4),transparent 55%),linear-gradient(135deg,#10182d 0%,#172541 52%,#111a32 100%)}
.wrap{width:min(1000px,calc(100% - 36px));margin:0 auto;padding:72px 0 56px}
.hero{text-align:center;margin-bottom:38px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#d9e4ff;font-size:12px;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 8px 30px #050b1b33}
.dot{width:7px;height:7px;border-radius:50%;background:#8bd5ff;box-shadow:0 0 14px #8bd5ff}
h1{font-size:clamp(30px,5vw,54px);line-height:1.18;letter-spacing:.025em;margin:22px 0 12px;font-weight:750;text-shadow:0 8px 35px #0005}
.subtitle{margin:0;color:var(--muted);font-size:14px;letter-spacing:.08em}
.panel{position:relative;border:1px solid rgba(255,255,255,.2);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);box-shadow:0 24px 80px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2);overflow:hidden;animation:rise 1s .12s cubic-bezier(.2,.8,.2,1) both}
.panel:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;border-bottom:1px solid var(--line)}
.panel-label{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:650;letter-spacing:.08em}
.icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:16px}
.count{font-size:12px;color:#d1dcf5;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.table-wrap{padding:10px 18px 20px}
table{width:100%;border-collapse:separate;border-spacing:0 9px;table-layout:fixed}
thead th{padding:12px 18px;color:#b9c8e8;text-align:left;font-size:12px;font-weight:600;letter-spacing:.16em}
thead th:first-child{width:27%}
tbody tr{background:rgba(255,255,255,.065);transition:transform .28s ease,background .28s ease,box-shadow .28s ease}
tbody tr:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);box-shadow:0 10px 24px rgba(0,0,0,.12)}
tbody td{padding:18px;color:#edf2ff;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.65;overflow-wrap:anywhere}
tbody td:first-child{border-left:1px solid rgba(255,255,255,.08);border-radius:13px 0 0 13px;color:#c9dcff;font-variant-numeric:tabular-nums}
tbody td:last-child{border-right:1px solid rgba(255,255,255,.08);border-radius:0 13px 13px 0}
.empty{padding:62px 20px 70px;text-align:center;color:var(--muted)}
.empty-symbol{width:54px;height:54px;margin:0 auto 17px;border-radius:18px;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.09);border:1px solid var(--line);box-shadow:inset 0 1px 0 #ffffff25}
.empty strong{display:block;color:#edf3ff;font-size:15px;font-weight:600;margin-bottom:7px}
.empty p{margin:0;font-size:13px;line-height:1.8}
.footer{text-align:center;color:#8291b2;font-size:11px;letter-spacing:.12em;margin-top:22px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatA{to{transform:translate(100px,80px) scale(1.15)}}
@keyframes floatB{to{transform:translate(-90px,-70px) scale(1.12)}}
@media(max-width:600px){.wrap{padding:48px 0 36px}.panel{border-radius:20px}.panel-head{padding:17px 18px}.table-wrap{padding:7px 10px 14px}thead th{padding:10px 12px}tbody td{padding:14px 12px;font-size:13px}thead th:first-child{width:31%}.empty{padding:48px 12px 54px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow"><span class="dot"></span> CLASS CHRONICLE · 2025</div>
    <h1>2025届七年级二班大事年表</h1>
    <p class="subtitle">记录班级时光 · 收藏共同记忆</p>
  </header>
  <section class="panel" aria-label="班级大事年表">
    <div class="panel-head">
      <div class="panel-label"><span class="icon">✦</span> 班级事件记录</div>
      <span class="count" id="event-count">等待添加事件</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">时间</th><th scope="col">事件</th></tr></thead>
        <tbody id="events">
          <tr id="empty-row"><td colspan="2">
            <div class="empty">
              <div class="empty-symbol">✧</div>
              <strong>精彩故事，即将载入</strong>
              <p>目前还没有添加事件<br>待补充内容发送后，这里就会成为属于七年级二班的时光档案。</p>
            </div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <footer class="footer">MADE OF OUR DAYS · CLASS 7-2</footer>
</main>
</body>
</html>
