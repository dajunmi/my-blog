<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>2025届七年级二班大事年表</title>
<style>
:root{
  --ink:#f5f7ff;
  --muted:#a6b2ce;
  --line:rgba(255,255,255,.15);
  --accent:#8bd5ff;
  --gold:#ffd666;
  --silver:#e2e8f0;
  --bronze:#f5a673;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;
  background:#000000;
  overflow-x:hidden;
}
#particles-canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
.wrap{
  position:relative;
  z-index:1;
  width:min(1060px,calc(100% - 32px));
  margin:0 auto;
  padding:68px 0 56px;
}
.hero{text-align:center;margin-bottom:36px;animation:rise .85s cubic-bezier(.2,.8,.2,1) both}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 15px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:99px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  color:#e6eeff;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  box-shadow:0 8px 30px rgba(0,0,0,.6);
}
.dot{width:7px;height:7px;border-radius:50%;background:#ffffff;box-shadow:0 0 12px #ffffff,0 0 22px #8bd5ff}
h1{
  font-size:clamp(30px,5vw,52px);
  line-height:1.18;
  letter-spacing:.03em;
  margin:20px 0 12px;
  font-weight:750;
  color:#ffffff;
  text-shadow:0 0 32px rgba(255,255,255,.25);
}
.subtitle{margin:0;color:var(--muted);font-size:14px;letter-spacing:.1em}

.panel{
  position:relative;
  border:1px solid rgba(255,255,255,.18);
  border-radius:24px;
  background:rgba(12,14,20,.78);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 24px 80px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.18);
  overflow:hidden;
  margin-bottom:28px;
}
.panel:before{
  content:"";
  position:absolute;
  inset:0 0 auto;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  padding:20px 26px;
  border-bottom:1px solid var(--line);
}
.panel-label{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:650;letter-spacing:.08em;color:#fff}
.icon{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:11px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  font-size:16px;
}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.count{
  font-size:12px;
  color:#dce6ff;
  padding:7px 12px;
  border-radius:99px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
}
.btn-ghost{
  padding:7px 13px;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.08);
  color:#ffffff;
  font-size:12px;
  cursor:pointer;
  transition:all .2s ease;
}
.btn-ghost:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}

/* Gate */
.gate-wrap{width:min(640px,100%);margin:0 auto 28px;animation:rise .85s .08s cubic-bezier(.2,.8,.2,1) both}
.gate{padding:30px}
.gate-title{text-align:center;margin:0 0 8px;font-size:clamp(22px,4vw,29px);letter-spacing:.02em;color:#fff}
.gate-desc{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px;line-height:1.7}
.question{margin:18px 0}
.question label{display:block;font-size:14px;font-weight:600;margin-bottom:9px;color:#edf2ff}
.question input{
  width:100%;
  padding:14px 15px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:13px;
  background:rgba(255,255,255,.05);
  color:#ffffff;
  font-size:15px;
  outline:none;
  transition:border .2s,box-shadow .2s;
}
.question input::placeholder{color:#7c88a4}
.question input:focus{border-color:#ffffff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.submit{
  width:100%;
  margin-top:10px;
  padding:14px 18px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:14px;
  color:#080c14;
  font-size:15px;
  font-weight:750;
  letter-spacing:.08em;
  cursor:pointer;
  background:linear-gradient(120deg,#ffffff,#d6e8ff 55%,#e8dcff);
  box-shadow:0 10px 28px rgba(255,255,255,.16);
  transition:transform .2s,filter .2s;
}
.submit:hover{transform:translateY(-2px);filter:brightness(1.06)}
.feedback{min-height:22px;margin:12px 0 0;text-align:center;font-size:13px;color:#ff9aa8}

/* Content container */
#content-area{display:none;animation:rise .65s ease both}
#content-area.visible{display:block}
.gate-hidden{display:none}

/* Leaderboard */
.rank-body{padding:20px 24px 24px}
.rank-tip{font-size:12px;color:var(--muted);margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.rank-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:12px;
}
.rank-card{
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 16px;
  border-radius:15px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  transition:transform .22s ease,background .22s ease,border-color .22s ease;
}
.rank-card:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.3);
}
.rank-card.active{
  background:rgba(139,213,255,.16);
  border-color:#8bd5ff;
  box-shadow:0 0 20px rgba(139,213,255,.2);
}
.rank-badge{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:14px;
  flex-shrink:0;
  background:rgba(255,255,255,.08);
  color:#dce6ff;
  border:1px solid rgba(255,255,255,.14);
}
.rank-1 .rank-badge{background:linear-gradient(135deg,#ffe58f,#faad14);color:#2b1d00;border:none;box-shadow:0 0 16px rgba(250,173,20,.45)}
.rank-2 .rank-badge{background:linear-gradient(135deg,#f8fafc,#94a3b8);color:#0f172a;border:none;box-shadow:0 0 14px rgba(226,232,240,.35)}
.rank-3 .rank-badge{background:linear-gradient(135deg,#ffd8bf,#d46b08);color:#2b1100;border:none;box-shadow:0 0 14px rgba(212,107,8,.35)}

.rank-info{flex:1;min-width:0}
.rank-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.rank-name{font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-score{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;flex-shrink:0}
.rank-1 .rank-score{color:var(--gold)}
.rank-2 .rank-score{color:var(--silver)}
.rank-3 .rank-score{color:var(--bronze)}

.bar-track{width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#7dd3fc,#ffffff);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rank-1 .bar-fill{background:linear-gradient(90deg,#faad14,#fff1b8)}
.rank-2 .bar-fill{background:linear-gradient(90deg,#94a3b8,#ffffff)}
.rank-3 .bar-fill{background:linear-gradient(90deg,#d46b08,#ffd8bf)}

/* Filter bar */
.filter-banner{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 20px;
  margin:14px 18px 0;
  border-radius:12px;
  background:rgba(139,213,255,.14);
  border:1px solid rgba(139,213,255,.4);
  font-size:13px;
  color:#eef7ff;
}
.filter-banner.show{display:flex}

/* Table */
.table-wrap{padding:10px 18px 20px}
table{width:100%;border-collapse:separate;border-spacing:0 9px;table-layout:fixed}
thead th{padding:12px 16px;color:#b9c8e8;text-align:left;font-size:12px;font-weight:600;letter-spacing:.14em}
thead th:nth-child(1){width:16%}
thead th:nth-child(2){width:44%}
thead th:nth-child(3){width:40%}
tbody tr{background:rgba(255,255,255,.05);transition:transform .24s ease,background .24s ease}
tbody tr:hover{transform:translateY(-2px);background:rgba(255,255,255,.11)}
tbody td{
  padding:16px;
  color:#f1f5ff;
  border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);
  font-size:14px;
  line-height:1.6;
  overflow-wrap:anywhere;
}
tbody td:first-child{
  border-left:1px solid rgba(255,255,255,.08);
  border-radius:13px 0 0 13px;
  color:#9ec5ff;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
tbody td:last-child{
  border-right:1px solid rgba(255,255,255,.08);
  border-radius:0 13px 13px 0;
}
.person-tag{
  display:inline-block;
  padding:3px 10px;
  margin:2px 4px 2px 0;
  border-radius:8px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  color:#e2ecff;
  font-size:12.5px;
}

.footer{text-align:center;color:#7d8ba8;font-size:11px;letter-spacing:.14em;margin-top:24px}

@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:680px){
  .wrap{padding:44px 0 36px}
  .panel{border-radius:18px}
  .panel-head{padding:16px 18px}
  .table-wrap{padding:6px 10px 14px}
  thead th{padding:10px 10px}
  tbody td{padding:13px 10px;font-size:13px}
  thead th:nth-child(1){width:18%}
  thead th:nth-child(2){width:42%}
  thead th:nth-child(3){width:40%}
  .rank-body{padding:16px}
  .rank-grid{grid-template-columns:1fr}
}
</style>
</head>

        <div class="rank-grid" id="rank-grid"></div>

    </section>

    <!-- 班级事件记录 -->
    <section class="panel" id="timeline" aria-label="班级大事年表">

        </div>
      </div>

      <div class="filter-banner" id="filter-banner">

        <button type="button" class="btn-ghost" id="clear-filter-btn">显示全部事件</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>

          </thead>
          <tbody id="events-tbody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <footer class="footer">MADE OF OUR DAYS · CLASS 7-2</footer>
</main>

// 集体或非具体个人词汇（不计入个人排行榜）
const COLLECTIVE_LABELS = new Set(['全班', '全年级', '双班同学', '大部分', '女生', 'Geography']);

function extractPeople(rawStr) {
  if (!rawStr) return [];
  const parts = rawStr.split(/[，,\s]+/).map(s => s.trim()).filter(Boolean);
  const result = [];
  for (let p of parts) {
    if (p === '等') continue;
    if (p.endsWith('等') && p.length > 1) {
      p = p.slice(0, -1);
    }
    if (!COLLECTIVE_LABELS.has(p)) {
      result.push(p);
    }
  }
  return result;
}

// 统计涉案次数并排序
function buildRanking(data) {
  const counts = new Map();
  data.forEach(item => {
    const people = extractPeople(item.people);
    // 同一事件若重复出现同一人去重计数
    const uniqueInEvent = new Set(people);
    uniqueInEvent.forEach(person => {
      counts.set(person, (counts.get(person) || 0) + 1);
    });
  });

  const sorted = Array.from(counts.entries())
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-CN'));

  // 计算并列排名
  let currentRank = 1;
  sorted.forEach((item, idx) => {
    if (idx > 0 && item.count < sorted[idx - 1].count) {
      currentRank = idx + 1;
    }
    item.rank = currentRank;
  });
  return sorted;
}

function renderRanking() {
  const list = showAllRanks ? RANKING_DATA : RANKING_DATA.slice(0, 10);
  rankGrid.innerHTML = '';

  list.forEach(item => {
    const card = document.createElement('div');
    const topClass = item.rank <= 3 ? ` rank-${item.rank}` : '';
    const activeClass = selectedPerson === item.name ? ' active' : '';
    card.className = `rank-card${topClass}${activeClass}`;

    const medal = item.rank === 1 ? '🥇' : item.rank === 2 ? '🥈' : item.rank === 3 ? '🥉' : item.rank;
    const pct = Math.max(8, Math.round((item.count / MAX_COUNT) * 100));

    card.innerHTML = `
      <div class="rank-badge">${medal}</div>
      <div class="rank-info">
        <div class="rank-top">
          <span class="rank-name">${item.name}</span>
          <span class="rank-score">${item.count} 次</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;

    card.addEventListener('click', () => {
      if (selectedPerson === item.name) {
        selectedPerson = null;
      } else {
        selectedPerson = item.name;
      }
      renderRanking();
      renderEvents();
    });

    rankGrid.appendChild(card);
  });

  toggleRankBtn.textContent = showAllRanks
    ? '收起至前 10 名'
    : `展开全部 (${RANKING_DATA.length}人)`;
}

function formatPeopleTags(rawStr) {
  if (!rawStr) return '<span class="person-tag">未知</span>';
  const tokens = rawStr.split(/[，,]+/).map(s => s.trim()).filter(Boolean);
  return tokens.map(t => `<span class="person-tag">${t}</span>`).join('');
}

function renderEvents() {
  const filtered = selectedPerson
    ? EVENTS_DATA.filter(item => extractPeople(item.people).includes(selectedPerson))
    : EVENTS_DATA;

  eventsTbody.innerHTML = '';
  filtered.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.time}</td>
      <td>${item.event}</td>
      <td>${formatPeopleTags(item.people)}</td>
    `;
    eventsTbody.appendChild(tr);
  });

  eventCountEl.textContent = `${filtered.length} 条记录`;

  if (selectedPerson) {
    filterBanner.classList.add('show');
    filterBannerText.textContent = `当前筛选涉案人员：「${selectedPerson}」（共 ${filtered.length} 起事件）`;
  } else {
    filterBanner.classList.remove('show');
  }
}

// 高辨识度纯黑背景白色粒子动效
(function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  const mouse = { x: null, y: null, radius: 150 };

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    createParticles();
  });

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.x = null;
    mouse.y = null;
  });

  let particles = [];

  function createParticles() {
    const count = Math.min(130, Math.max(65, Math.floor((width * height) / 11000)));
    particles = [];
    for (let i = 0; i < count; i++) {
      const radius = Math.random() * 2.6 + 1.4; // 1.4px ~ 4.0px 明显大小
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 1.15,
        vy: (Math.random() - 0.5) * 1.15,
        radius: radius,
        alpha: Math.random() * 0.45 + 0.55 // 0.55 ~ 1.0 高亮度
      });
    }
  }

  createParticles();

  function animate() {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      // 鼠标排斥/互动微调
      if (mouse.x !== null && mouse.y !== null) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < mouse.radius && dist > 0) {
          const force = (mouse.radius - dist) / mouse.radius;
          p.x += (dx / dist) * force * 2.2;
          p.y += (dy / dist) * force * 2.2;
        }
      }

      // 绘制发光白色粒子
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();

      // 粒子间白色连线增强动效层次
      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (dist < 135) {
          const lineAlpha = (1 - dist / 135) * 0.28;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(255, 255, 255, ${lineAlpha})`;
          ctx.lineWidth = 0.9;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
})();
