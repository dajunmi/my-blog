<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白色粒子 · 黑色背景</title>
    <style>
        /* 基础重置，确保纯黑背景和全屏覆盖 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;         /* 防止滚动条破坏全屏效果 */
            background-color: #000000; /* 纯黑背景 */
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* 粒子画布：固定在左侧/顶部，全屏覆盖 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;      /* 让鼠标事件穿透画布，不影响可能的交互/选择 */
            z-index: 1;               /* 置于底层，但位于黑背景之上 */
        }

        /* 文字容器：绝对居中，超大字体，优雅可读 */
        .content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 1400px;        /* 限制极大宽度，防止在超大屏幕上过于松散 */
            text-align: center;
            z-index: 2;               /* 保证文字在粒子之上 */
            pointer-events: none;     /* 让文字不阻挡鼠标，但保留可选择性（可以手动开启，这里保持穿透以不干扰粒子视觉） */
            /* 文字不被选中本身影响不大，但保留穿透让粒子动效更“纯粹” */
        }

        /* 主要链接与密码文字：白色、特大、粗细适中、有轻微光晕 */
        .main-text {
            color: #ffffff;
            font-weight: 600;
            font-size: clamp(2rem, 10vw, 5.5rem);  /* 响应式特大字体：在手机~桌面都足够大 */
            line-height: 1.4;
            letter-spacing: 0.02em;
            word-break: break-all;     /* 确保长URL不会溢出，但我们的字号动态适应 */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); /* 轻微辉光，增加质感 */
            display: flex;
            flex-direction: column;
            gap: 0.2em;
        }

        /* 两个文本块分别微调，让密码视觉上稍微突出 */
        .url-line {
            font-size: clamp(1.8rem, 8vw, 4.5rem);
            opacity: 0.95;
            /* 网址较长，允许换行，但因为有word-break，显示完整 */
            word-break: break-all;
        }

        .password-line {
            font-size: clamp(1.8rem, 8vw, 4.8rem); /* 与网址接近或稍大，突出密码 */
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.45);
        }

        /* 对于极窄屏幕，避免文字过于拥挤 */
        @media (max-width: 480px) {
            .main-text {
                gap: 0.1em;
            }
            .url-line {
                font-size: clamp(1.4rem, 7vw, 2.4rem);
            }
            .password-line {
                font-size: clamp(1.6rem, 8vw, 2.8rem);
            }
        }

        /* 让文字可以被选中以便复制（但容器 pointer-events 为 none 会阻止选择）
           为了用户体验，保留可选择性？如果我们希望用户能复制链接和密码，可以取消 pointer-events: none 
           但粒子会稍微被遮挡？这里通过为文字单独设置 pointer-events: auto 来允许选择，同时粒子仍穿透（因为画布在下方且pointer-events已设置为none）
           但文字容器用了pointer-events: none，它不会捕获事件；里面的文字如果需要选择，单独设置 pointer-events: auto 即可。 */
        .url-line, .password-line {
            pointer-events: auto;      /* 允许用户选中文本进行复制，同时不影响画布 */
            user-select: text;         /* 明确允许选择 */
            cursor: text;              /* 文本光标 */
        }

        /* 为了视觉效果更干净，可以移除任何焦点轮廓 */
        .url-line:focus, .password-line:focus {
            outline: none;
        }

        /* 粒子canvas在canvas层上，但我们在上面又放置了文字容器，z-index已分开 */
    </style>
</head>
<body>

    <!-- 白色粒子动画画布 -->
    <canvas id="particle-canvas"></canvas>

    <!-- 中央特大号文字：链接 + 密码 -->
    <div class="content">
        <div class="main-text">
            <span class="url-line" tabindex="0">https://wwbxo.lanzoue.com/b01i60lzad</span>
            <span class="password-line" tabindex="0">密码：h6rf</span>
        </div>
    </div>

    <script>
        (function() {
            // 获取画布和上下文
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');

            // 粒子系统配置
            let width = window.innerWidth;
            let height = window.innerHeight;
            let particles = [];
            // 粒子数量根据面积调整，保持视觉密度适中，同时性能良好
            const PARTICLE_DENSITY = 0.00025; // 每平方像素约0.00025个粒子 → 例如1920*1080 ≈ 518个，良好
            let particleCount = Math.floor(width * height * PARTICLE_DENSITY);
            // 最小/最大数量限制
            const MIN_PARTICLES = 120;
            const MAX_PARTICLES = 900;

            // 若计算出的粒子数不在合理范围内则调整
            if (particleCount < MIN_PARTICLES) particleCount = MIN_PARTICLES;
            if (particleCount > MAX_PARTICLES) particleCount = MAX_PARTICLES;

            // 粒子半径范围
            const MIN_RADIUS = 0.8;
            const MAX_RADIUS = 3.2;

            // 速度范围 (像素/帧) —— 非常轻柔的漂浮
            const MIN_SPEED = 0.12;
            const MAX_SPEED = 0.6;

            // 存储粒子对象
            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    // 随机速度矢量，方向任意，但保持缓慢
                    const angle = Math.random() * Math.PI * 2;
                    const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    // 半径: 范围分布，大部分小部分稍大
                    this.radius = MIN_RADIUS + Math.random() * (MAX_RADIUS - MIN_RADIUS);
                    // 透明度: 0.5 ~ 1.0 之间，让粒子有层次感
                    this.alpha = 0.6 + Math.random() * 0.4; // 0.6-1.0
                    // 保存基础透明度以便闪烁使用（可选），但我们保持稳定透明度更干净
                }

                // 更新位置，边界环绕（从另一边出现）
                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    // 边界环绕：当粒子完全移出画面后，从对面重新进入
                    // 考虑到半径，需要更宽松的边界，但为了视觉连续性，使用模运算风格
                    if (this.x < -this.radius) {
                        this.x = width + this.radius;
                    } else if (this.x > width + this.radius) {
                        this.x = -this.radius;
                    }

                    if (this.y < -this.radius) {
                        this.y = height + this.radius;
                    } else if (this.y > height + this.radius) {
                        this.y = -this.radius;
                    }
                }

                // 绘制粒子 (白色)
                draw(ctx) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    // 使用纯白色，配合透明度实现柔和效果
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                    ctx.fill();
                    // 可选：增加非常微小的模糊感？不需要，圆形即可
                }
            }

            // 初始化所有粒子
            function initParticles() {
                particles = [];
                // 重新根据当前画布尺寸计算粒子数量
                const area = width * height;
                let count = Math.floor(area * PARTICLE_DENSITY);
                // 限制范围，防止极端屏幕下数量失控
                count = Math.min(MAX_PARTICLES, Math.max(MIN_PARTICLES, count));
                particleCount = count;

                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            // 调整画布尺寸（响应窗口变化）
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;

                // 设置画布实际尺寸
                canvas.width = width;
                canvas.height = height;

                // 根据新尺寸重新初始化粒子，保证密度和分布合理
                initParticles();
            }

            // 动画循环
            function animate() {
                // 清除画布，使用黑色背景覆盖（由于body背景也是黑色，但canvas需要清除）
                // 为了保持纯黑背景且无残影，使用全黑填充
                ctx.clearRect(0, 0, width, height);
                // 或者也可以用 fillRect 填充黑色，但 clearRect 足够，因为body背景是黑色
                // 但确保画布背景是透明的，能透出body黑色
                // 但是canvas默认透明，背景黑色由body显示，没问题。
                // 不过为了绝对纯黑且避免任何杂色，我们也可以填充黑色。
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                // 更新并绘制所有粒子
                for (let p of particles) {
                    p.update();
                    p.draw(ctx);
                }

                // 请求下一帧
                requestAnimationFrame(animate);
            }

            // 监听窗口大小变化 (使用防抖以节省性能)
            let resizeTimeout;
            window.addEventListener('resize', function() {
                if (resizeTimeout) clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resizeCanvas();
                }, 150); // 150ms 防抖
            });

            // 启动一切
            function init() {
                // 初始化画布尺寸
                resizeCanvas();
                // 开始动画循环
                animate();
            }

            init();

        })();
    </script>
</body>
</html>
